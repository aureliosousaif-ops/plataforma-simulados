<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Plataforma de Simulados
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'home' %}"
        >
            Plataforma de Simulados
        </a>

        <div class="navbar-nav ms-auto">

            {% if user.is_authenticated %}

                <a
                    class="nav-link"
                    href="{% url 'usuarios:perfil' %}"
                >
                    Meu perfil
                </a>

                <form
                    method="post"
                    action="{% url 'usuarios:logout' %}"
                    class="d-inline"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-link nav-link"
                    >
                        Sair
                    </button>
                </form>

            {% else %}

                <a
                    class="nav-link"
                    href="{% url 'usuarios:login' %}"
                >
                    Entrar
                </a>

                <a
                    class="nav-link"
                    href="{% url 'usuarios:cadastro' %}"
                >
                    Criar conta
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<main class="container py-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
