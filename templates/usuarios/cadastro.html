{% extends 'base.html' %}

{% block title %}
    Criar conta
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <h2 class="mb-4">
            Criar conta
        </h2>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label
                        for="{{ field.id_for_label }}"
                        class="form-label"
                    >
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors }}
                        </div>
                    {% endif %}

                </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Criar conta
            </button>

        </form>

    </div>

</div>

{% endblock %}
